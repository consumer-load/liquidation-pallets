<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 80" width="460" height="80" fill="none">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="logoOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="logoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#F59E0B" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ICON EMBLEM -->
  <g transform="translate(4, 6)">
    <!-- Rounded Background Badge -->
    <rect width="68" height="68" rx="18" fill="url(#logoBgGrad)"/>
    <rect x="1" y="1" width="66" height="66" rx="17" stroke="#334155" stroke-width="1.5" fill="none"/>

    <!-- 3D Pallet Base (Bottom Wooden Skid) -->
    <path d="M14 51 L34 59 L54 51 L34 44 Z" fill="#334155" opacity="0.9"/>
    <path d="M14 51 L34 59 L34 62 L14 54 Z" fill="#1E293B"/>
    <path d="M34 59 L54 51 L54 54 L34 62 Z" fill="#0F172A"/>
    <!-- Forklift Slots -->
    <rect x="21" y="53" width="4.5" height="2.5" rx="0.5" fill="#0B0F17"/>
    <rect x="42" y="53" width="4.5" height="2.5" rx="0.5" fill="#0B0F17"/>

    <!-- Left Blue Box -->
    <path d="M17 38 L30 43 L30 51 L17 46 Z" fill="#1D4ED8"/>
    <path d="M30 43 L36 40 L36 48 L30 51 Z" fill="#1E40AF"/>
    <path d="M17 38 L23 35 L36 40 L30 43 Z" fill="url(#logoBlue)"/>

    <!-- Right Orange High-Yield Box -->
    <path d="M28 25 L48 33 L48 47 L28 39 Z" fill="#D97706" filter="url(#logoGlow)"/>
    <path d="M48 33 L57 29 L57 43 L48 47 Z" fill="#B45309"/>
    <path d="M28 25 L37 21 L57 29 L48 33 Z" fill="url(#logoOrange)"/>

    <!-- Tape Strip -->
    <path d="M42 22.5 L44 23.5 L36 41 L34 40 Z" fill="#FEF3C7" opacity="0.6"/>

    <!-- Amazon Signature Arrow Curve -->
    <path d="M18 47 Q 34 56 50 42" stroke="url(#logoOrange)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M46 42 L51 41.5 L49 46" stroke="url(#logoOrange)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Amazon Inset inside box -->
    <text x="38" y="35" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6" font-weight="900" letter-spacing="0.2" fill="#FFFFFF" text-anchor="middle" transform="skewY(22)">AMAZON</text>
  </g>

  <!-- LOGO TEXT SECTION -->
  <g transform="translate(86, 0)">
    <!-- Primary Brand Line -->
    <text x="0" y="44" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="31" font-weight="900" letter-spacing="-0.5">
      <tspan fill="#F59E0B">AMAZON</tspan>
      <tspan fill="#0F172A" dx="7">PALLETS</tspan>
    </text>

    <!-- Subtitle / Domain URL Badge -->
    <g transform="translate(0, 52)">
      <rect width="215" height="19" rx="6" fill="#0F172A"/>
      <text x="10" y="13.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" font-weight="700" fill="#F8FAFC" letter-spacing="1.5">LIQUIDATION.COM</text>
      <!-- Wholesale Badge -->
      <circle cx="188" cy="9.5" r="3" fill="#10B981"/>
      <text x="195" y="13" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#10B981" letter-spacing="0.5">DIRECT</text>
    </g>
  </g>
</svg>
