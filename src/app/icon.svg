<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#F59E0B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Rounded App Background Tile -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#334155" stroke-width="1.5" fill="none"/>

  <!-- Isometric / 3D Pallet Base (Bottom Wooden Skid) -->
  <path d="M12 47 L32 55 L52 47 L32 40 Z" fill="#334155" opacity="0.9"/>
  <!-- Front Pallet Blocks -->
  <path d="M12 47 L32 55 L32 58 L12 50 Z" fill="#1E293B"/>
  <path d="M32 55 L52 47 L52 50 L32 58 Z" fill="#0F172A"/>
  <!-- Pallet Forklift Slots -->
  <rect x="19" y="49" width="4" height="2.5" rx="0.5" fill="#0B0F17"/>
  <rect x="41" y="49" width="4" height="2.5" rx="0.5" fill="#0B0F17"/>

  <!-- Left Box (Sapphire Blue Box) -->
  <path d="M16 35 L28 40 L28 47 L16 42 Z" fill="#1D4ED8"/>
  <path d="M28 40 L33 37 L33 44 L28 47 Z" fill="#1E40AF"/>
  <path d="M16 35 L21 32 L33 37 L28 40 Z" fill="url(#blueGrad)"/>

  <!-- Right / Main High-Yield Box (Amazon Gold/Orange Stack) -->
  <path d="M26 23 L46 31 L46 43 L26 35 Z" fill="#D97706" filter="url(#glow)"/>
  <path d="M46 31 L54 27 L54 39 L46 43 Z" fill="#B45309"/>
  <path d="M26 23 L34 19 L54 27 L46 31 Z" fill="url(#orangeGrad)"/>

  <!-- Box Packing Tape Accent -->
  <path d="M39 20.5 L41 21.5 L33 38 L31 37 Z" fill="#FEF3C7" opacity="0.6"/>

  <!-- Dynamic Wholesale Arrow / Swoosh (AMZ Signature Arrow) -->
  <path d="M18 43 Q 32 51 47 38" stroke="url(#orangeGrad)" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M43 38 L48 37.5 L46 42" stroke="url(#orangeGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Bold Lettering 'AMAZON' on Box -->
  <text x="36" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="5.2" font-weight="900" letter-spacing="0.2" fill="#FFFFFF" text-anchor="middle" transform="skewY(22)">AMAZON</text>
</svg>
